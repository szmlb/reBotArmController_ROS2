draw_square:
  ros__parameters:
    group_name: arm
    joint_names:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    wrap_joint_names:
      - joint6

    frame_id: base_link
    tcp_link_name: gripper_tcp
    start_point: [0.0, -0.75, -0.55, 0.0, 0.0, 0.0]

    rectangle_center: [0.28, 0.0, 0.12]
    rectangle_width: 0.04
    rectangle_height: 0.08
    tcp_rpy: [0.0, 1.57, 0.0]

    planning_time: 5.0
    planner_id: RRTConnect
    pipeline_id: ompl
    joint_tolerance: 0.01
    velocity_scaling: 0.2
    acceleration_scaling: 0.2
    result_timeout: 30.0
    avoid_collisions: true
    cartesian_max_step: 0.005
    cartesian_min_fraction: 0.95
